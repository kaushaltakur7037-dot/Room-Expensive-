#splash{position:fixed;inset:0;z-index:99;background:linear-gradient(160deg,#0a4fb5,#0a7be8);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .5s}
#splash.off{opacity:0;pointer-events:none}
#splash img{width:150px;height:150px;border-radius:34px;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:pop .8s ease both}
#splash h1{margin:22px 0 4px;font-size:26px;animation:up .8s .3s ease both}
#splash p{margin:0;opacity:.85;animation:up .8s .5s ease both}
.bar{width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.3);margin-top:34px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;animation:ld 1.8s ease forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes ld{to{width:100%}}
header{position:sticky;top:0;z-index:5;background:linear-gradient(160deg,#0a4fb5,#0a7be8);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
header img{width:38px;height:38px;border-radius:10px}
header b{font-size:18px}
main{max-width:560px;margin:auto;padding:14px 14px calc(110px + env(safe-area-inset-bottom,0px))}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--mut);font-weight:600}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:11px;width:100%}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1;min-width:0}
button.p{background:var(--pri);color:#fff;border:0;font-weight:600}
.total{font-size:30px;font-weight:700;margin-top:10px}
.sub{color:var(--mut);font-size:13px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-top:10px}
.pp{border:1px solid var(--bd);border-radius:12px;padding:9px;text-align:center;font-size:14px}
.pp b{display:block;font-size:16px}
.bad{color:var(--bad)}
.it{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--bd);padding:10px 0;gap:8px}
.it:first-of-type{border-top:0}.it small{color:var(--mut);display:block}
.x{width:auto;padding:4px 10px;color:var(--bad);background:none;border:0}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chk label{flex:1 0 30%;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bd);border-radius:12px;padding:9px 4px;font-size:14px}
.chk input{width:auto;margin:0}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin:auto;z-index:5;display:flex;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:6px;box-shadow:0 8px 28px rgba(10,60,160,.22)}
nav button{flex:1;border:0;background:none;border-radius:18px;padding:8px 4px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;transition:.25s}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:linear-gradient(160deg,#0a4fb5,#0a7be8);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(10,95,214,.4)}
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
#modal.show{display:flex}
#modal .box{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:380px}
#modal h3{margin:0 0 10px}
#me{color:var(--bad);font-size:13px;min-height:18px;margin:6px 0}
header button{margin-left:auto;width:auto;background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600}
.credit{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mut);font-size:13px;margin:6px 0}
.credit img{width:28px;height:28px;border-radius:8px}
.scredit{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:13px;opacity:.85}
.danger{background:none;color:var(--bad);border:1px solid var(--bad);font-weight:600;margin-bottom:12px}
.rcode{font-size:30px;font-weight:700;letter-spacing:4px;text-align:center;margin:8px 0;color:var(--pri)}
</style>
</head>

<div class="card"><h2 data-i="people"></h2><div id="plist"></div></div>
<div class="card"><h2 data-i="newP"></h2><div class="row"><input id="nn" data-p="nameP"><button class="p" id="addp" style="flex:0 0 90px" data-i="add"></button></div></div>
</section>
</main>

<div id="modal"><div class="box"><h3 id="mt"></h3><div id="mb"></div><div id="me"></div><div class="row"><button id="mc" data-i="cancel"></button><button class="p" id="mo" data-i="ok"></button></div></div></div>
<nav>
<button class="on" data-t="home"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><span data-i="nHome"></span></button>
<button data-t="add"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span data-i="nAdd"></span></button>
<button data-t="ppl"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14c2.8.2 4.5 2 4.5 5"/></svg><span data-i="nPpl"></span></button>
</nav>

<script>
const $=id=>document.getElementById(id);
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const L={
hi:{app:"Room Expensive",made:"कौशल ठाकुर द्वारा निर्मित",roomH:"रूम कोड",roomNew:"नया रूम बनाएँ",orJoin:"या कोड डालकर किसी रूम से जुड़ें",codeP:"रूम कोड",roomJoin:"जुड़ें",yourCode:"आपके रूम का कोड (सबको यही कोड दें)",live:"● जुड़ा हुआ है — सबका हिसाब एक जैसा रहेगा",copy:"कोड कॉपी करें",leave:"रूम छोड़ें",copied:"कोड कॉपी हो गया",fbNo:"रूम कोड चालू करने के लिए पहले Firebase जोड़ना बाकी है।",fbErr:"जुड़ नहीं पाया। इंटरनेट देखें और दोबारा कोशिश करें।",codeBad:"सही रूम कोड डालें",noRoom:"यह रूम कोड नहीं मिला",joinT:"रूम से जुड़ना है?",joinI:"इस फ़ोन का मौजूदा हिसाब रूम के हिसाब से बदल जाएगा।",leaveT:"रूम छोड़ें?",leaveI:"इसके बाद यह फ़ोन रूम से अलग हो जाएगा। हिसाब इस फ़ोन में बना रहेगा।",reset:"इस महीने का हिसाब रीसेट करें",resetT:"महीने का हिसाब रीसेट",resetI:"{m} के सभी खर्चे हमेशा के लिए हट जाएँगे। इसके लिए सभी लोग मौजूद हों और अपना-अपना PIN डालें।",tag:"साथ का हिसाब, साफ़ हिसाब",nHome:"हिसाब",nAdd:"खर्चा",nPpl:"लोग",month:"महीना",paidShare:"किसने दिया / उसका हिस्सा",settleH:"हिसाब बराबर कैसे होगा",listH:"खर्चों की सूची",addH:"नया खर्चा जोड़ें",amtP:"रुपये ₹",forP:"किसलिए? (राशन, बिजली...)",usedBy:"किस-किस ने उपयोग किया? (सिर्फ़ इनका हिस्सा लगेगा)",add:"जोड़ें",people:"कमरे के लोग",newP:"नया व्यक्ति जोड़ें",nameP:"नाम लिखें",cancel:"रद्द करें",ok:"ठीक है",
pays:"{a} → {b} को {x} देगा",allSet:"सब बराबर है ✅",none:"अभी कोई खर्चा नहीं",noMonth:"इस महीने कोई खर्चा नहीं",share:"हिस्सा",everyone:"सब",forW:"{x} के लिए",pinSet:"PIN सेट है ✅",pinNot:"PIN सेट नहीं",rm:"✕ हटाएँ",pinOf:"{n} का PIN",oldPin:"पुराना PIN",newPin:"नया 4 अंकों का PIN",oldBad:"पुराना PIN ग़लत है",pin4:"4 अंकों का PIN डालें",delT:"खर्चा हटाना है",delI:"हटाने के लिए सभी लोग मौजूद हों और अपना-अपना PIN डालें।",pinBad:"किसी का PIN ग़लत है",needPins:"पहले इन सबका PIN सेट करें (लोग टैब): {x}",dup:"यह नाम पहले से मौजूद है",usedP:"{n} के खर्चे सूची में हैं, इसलिए इन्हें हटाया नहीं जा सकता",confP:"{n} को हटाएँ?",noPeople:"पहले लोग टैब में नाम जोड़ें",badAmt:"सही राशि डालें",oneUser:"कम से कम एक व्यक्ति चुनें",other:"दूसरी भाषा"},
en:{app:"Room Expensive",made:"Made by Kaushal Thakur",roomH:"Room code",roomNew:"Create new room",orJoin:"Or join a room with a code",codeP:"Room code",roomJoin:"Join",yourCode:"Your room code (share it with everyone)",live:"● Connected: everyone sees the same data",copy:"Copy code",leave:"Leave room",copied:"Code copied",fbNo:"Room code needs Firebase to be set up first.",fbErr:"Could not connect. Check internet and try again.",codeBad:"Enter a valid room code",noRoom:"Room code not found",joinT:"Join this room?",joinI:"This phone's current data will be replaced by the room's data.",leaveT:"Leave room?",leaveI:"This phone will disconnect from the room. Data stays on this phone.",reset:"Reset this month's data",resetT:"Reset month",resetI:"All expenses of {m} will be permanently deleted. Everyone must be present and enter their own PIN.",tag:"Shared expenses, made simple",nHome:"Summary",nAdd:"Expense",nPpl:"People",month:"Month",paidShare:"Paid / Share",settleH:"How to settle up",listH:"Expense list",addH:"Add new expense",amtP:"Amount ₹",forP:"For what? (groceries, electricity...)",usedBy:"Who used it? (only they share the cost)",add:"Add",people:"Roommates",newP:"Add a person",nameP:"Enter name",cancel:"Cancel",ok:"OK",
pays:"{a} pays {b} {x}",allSet:"All settled ✅",none:"No expenses yet",noMonth:"No expenses this month",share:"share",everyone:"Everyone",forW:"for {x}",pinSet:"PIN set ✅",pinNot:"PIN not set",rm:"✕ Remove",pinOf:"{n}'s PIN",oldPin:"Old PIN",newPin:"New 4-digit PIN",oldBad:"Old PIN is incorrect",pin4:"Enter a 4-digit PIN",delT:"Delete expense",delI:"To delete, everyone must be present and enter their own PIN.",pinBad:"Someone's PIN is incorrect",needPins:"First set a PIN for: {x} (People tab)",dup:"This name already exists",usedP:"{n} has expenses on record, so cannot be removed",confP:"Remove {n}?",noPeople:"Add people in the People tab first",badAmt:"Enter a valid amount",oneUser:"Select at least one person"}};
let lang=ld("rk_lang","hi");
const t=(k,v)=>{let s=L[lang][k];if(v)for(const a in v)s=s.replace("{"+a+"}",v[a]);return s};
function applyLang(){
  document.documentElement.lang=lang;document.title=t("app");
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=t(e.dataset.p));
  $("lg").textContent=lang==="hi"?"English":"हिन्दी";
}
$("lg").onclick=()=>{lang=lang==="hi"?"en":"hi";try{localStorage.setItem("rk_lang",JSON.stringify(lang))}catch(e){}applyLang();fill();render();renderRoom()};

let P=ld("rk_people",["Abhishek","Kaushal","Gajendra"]);
let D=ld("rk_data",ld("roomkharcha",[]));
let K=ld("rk_pins",{});
let room=ld("rk_room","");let db=null,ref=null;
const FB={apiKey:"",authDomain:"",databaseURL:"",projectId:"",appId:""};
D.forEach(x=>{if(!x.parts||!x.parts.length)x.parts=[...P]});
const save=()=>{try{localStorage.setItem("rk_people",JSON.stringify(P));localStorage.setItem("rk_data",JSON.stringify(D));localStorage.setItem("rk_pins",JSON.stringify(K));localStorage.setItem("rk_room",JSON.stringify(room))}catch(e){}};
const h=s=>{let x=5381;for(const c of "rk|"+s)x=((x<<5)+x+c.charCodeAt(0))|0;return x};
const rs=n=>"₹"+Math.round(n*100)/100;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=new Date().toISOString().slice(0,10);
$("date").value=today;$("mon").value=today.slice(0,7);

setTimeout(()=>{$("splash").classList.add("off");setTimeout(()=>$("splash").remove(),600)},2000);

function tab(x){
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===x));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===x));
  window.scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>tab(b.dataset.t));

function fill(){
  const cw=$("who").value,un=[...document.querySelectorAll("#parts input:not(:checked)")].map(c=>c.value);
  $("who").innerHTML=P.map(n=>`<option>${esc(n)}</option>`).join("");if(P.includes(cw))$("who").value=cw;
  $("parts").innerHTML=P.map(n=>`<label><input type="checkbox" value="${esc(n)}" ${un.includes(n)?"":"checked"}>${esc(n)}</label>`).join("");
  $("plist").innerHTML=P.map((n,i)=>`<div class="it"><div><b>${esc(n)}</b><small>${K[n]!==undefined?t("pinSet"):t("pinNot")}</small></div><div><button class="x" style="color:var(--pri)" data-k="${i}">PIN</button><button class="x" data-i="${i}">${t("rm")}</button></div></div>`).join("");
  $("plist").querySelectorAll("button").forEach(b=>b.onclick=()=>b.dataset.k!==undefined?setPin(P[+b.dataset.k]):delP(+b.dataset.i));
}
$("addp").onclick=()=>{
  const n=$("nn").value.trim();
  if(!n)return;
  if(P.some(p=>p.toLowerCase()===n.toLowerCase())){say(t("dup"));return}
  P.push(n);$("nn").value="";save();fill();render();fbPeople();
};
function delP(i){
  const n=P[i];
  if(D.some(x=>x.who===n||x.parts.includes(n))){say(t("usedP",{n}));return}
  modal(t("confP",{n}),"",()=>{P.splice(i,1);delete K[n];save();fill();render();fbPeople();fbPin(n);return true})
}

$("addb").onclick=()=>{
  const a=parseFloat($("amt").value);
  if(!P.length){say(t("noPeople"));return}
  if(!a||a<=0){say(t("badAmt"));return}
  const parts=[...document.querySelectorAll("#parts input:checked")].map(c=>c.value);
  if(!parts.length){say(t("oneUser"));return}
  const d=$("date").value||today;
  const nx={id:Date.now(),who:$("who").value,amt:a,date:d,for:$("for").value.trim()||"-",parts};D.push(nx);fbExp(nx);
  $("amt").value="";$("for").value="";
  document.querySelectorAll("#parts input").forEach(c=>c.checked=true);
  $("mon").value=d.slice(0,7);
  save();render();tab("home");
};
$("mon").onchange=render;

let mok=null;
function modal(title,body,ok,nc){$("mt").textContent=title;$("mb").innerHTML=body;$("me").textContent="";mok=ok;$("mc").style.display=nc?"none":"";$("modal").classList.add("show")}
function say(m){modal(t("app"),'<div style="font-size:15px">'+esc(m)+"</div>",()=>true,true)}
$("mc").onclick=()=>$("modal").classList.remove("show");
$("mo").onclick=()=>{if(mok&&mok()!==false)$("modal").classList.remove("show")};
const pi=(ph,extra)=>`<input type="password" inputmode="numeric" maxlength="4" placeholder="${ph}" ${extra}>`;
function setPin(n){
  const has=K[n]!==undefined;
  modal(t("pinOf",{n}),(has?pi(t("oldPin"),'id="p0" style="margin-bottom:8px"'):"")+pi(t("newPin"),'id="p1"'),()=>{
    if(has&&h($("p0").value)!==K[n]){$("me").textContent=t("oldBad");return false}
    const v=$("p1").value;
    if(!/^\d{4}$/.test(v)){$("me").textContent=t("pin4");return false}
    K[n]=h(v);save();fill();fbPin(n);return true;
  });
}
function del(id){
  const x=D.find(e=>e.id===id);if(!x)return;
  const miss=P.filter(n=>K[n]===undefined);
  if(miss.length){say(t("needPins",{x:miss.join(", ")}));return}
  modal(t("delT"),'<div class="sub" style="margin-bottom:10px">'+esc(x.who)+" · "+esc(x.for)+" · "+rs(x.amt)+"<br>"+t("delI")+"</div>"+P.map((n,i)=>`<div class="row"><div style="flex:0 0 38%;align-self:center">${esc(n)}</div>${pi("PIN",'data-n="'+i+'"')}</div>`).join(""),()=>{
    const ok=[...$("mb").querySelectorAll("input")].every(inp=>h(inp.value)===K[P[+inp.dataset.n]]);
    if(!ok){$("me").textContent=t("pinBad");return false}
    D=D.filter(e=>e.id!==id);save();render();fbDel([id]);return true;
  });
}

function rst(){
  const m=$("mon").value,ml=m.split("-").reverse().join("/");
  if(!D.some(x=>x.date.startsWith(m))){say(t("noMonth"));return}
  const miss=P.filter(n=>K[n]===undefined);
  if(miss.length){say(t("needPins",{x:miss.join(", ")}));return}
  modal(t("resetT"),'<div class="sub" style="margin-bottom:10px">'+t("resetI",{m:ml})+"</div>"+P.map((n,i)=>`<div class="row"><div style="flex:0 0 38%;align-self:center">${esc(n)}</div>${pi("PIN",'data-n="'+i+'"')}</div>`).join(""),()=>{
    const ok=[...$("mb").querySelectorAll("input")].every(inp=>h(inp.value)===K[P[+inp.dataset.n]]);
    if(!ok){$("me").textContent=t("pinBad");return false}
    const ids=D.filter(e=>e.date.startsWith(m)).map(e=>e.id);D=D.filter(e=>!e.date.startsWith(m));save();render();fbDel(ids);return true;
  });
}
$("rst").onclick=rst;
function render(){
  const m=$("mon").value;
  const Lst=D.filter(x=>x.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const sp={},sh={};P.forEach(n=>{sp[n]=0;sh[n]=0});
  Lst.forEach(x=>{
    if(x.who in sp)sp[x.who]+=x.amt;
    x.parts.forEach(n=>{if(n in sh)sh[n]+=x.amt/x.parts.length});
  });
  const tot=Lst.reduce((s,x)=>s+x.amt,0);
  $("tot").textContent=rs(tot);
  $("per").innerHTML=P.map(n=>`<div class="pp">${esc(n)}<b>${rs(sp[n])}</b><span class="sub">${t("share")} ${rs(sh[n])}</span></div>`).join("");
  const bal=P.map(n=>({n,b:sp[n]-sh[n]}));
  const cr=bal.filter(x=>x.b>0.5).sort((a,b)=>b.b-a.b),db=bal.filter(x=>x.b<-0.5).sort((a,b)=>a.b-b.b);
  const out=[];let i=0,j=0;
  while(i<db.length&&j<cr.length){
    const d=Math.min(-db[i].b,cr[j].b);
    out.push("<div>"+t("pays",{a:"<b>"+esc(db[i].n)+"</b>",b:"<b>"+esc(cr[j].n)+"</b>",x:'<b class="bad">'+rs(d)+"</b>"})+"</div>");
    db[i].b+=d;cr[j].b-=d;
    if(db[i].b>-0.5)i++;
    if(cr[j].b<0.5)j++;
  }
  $("settle").innerHTML=out.length?out.join(""):(tot?t("allSet"):t("none"));
  $("list").innerHTML=Lst.length?Lst.map(x=>{
    const all=x.parts.length===P.length&&P.every(n=>x.parts.includes(n));
    const fw=t("forW",{x:all?t("everyone"):esc(x.parts.join(", "))});
    return `<div class="it"><div><b>${esc(x.who)}</b> · ${esc(x.for)}<small>${x.date.split("-").reverse().join("/")} · ${fw}</small></div><div><b>${rs(x.amt)}</b> <button class="x" data-id="${x.id}">✕</button></div></div>`}).join(""):'<div class="sub">'+t("noMonth")+"</div>";
  $("list").querySelectorAll("button").forEach(b=>b.onclick=()=>del(+b.dataset.id));
}
const enc=s=>encodeURIComponent(s).replace(/\./g,"%2E");
const gen=()=>{const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";crypto.getRandomValues(new Uint8Array(8)).forEach(x=>s+=c[x%32]);return s};
function initFb(){
  if(!window.firebase||!FB.databaseURL)return false;
  if(!firebase.apps.length)firebase.initializeApp(FB);
  db=firebase.database();return true;
}
function fbExp(x){if(ref)ref.child("exp/"+x.id).set(x)}
function fbDel(ids){if(!ref||!ids.length)return;const u={};ids.forEach(i=>u["exp/"+i]=null);ref.update(u)}
function fbPeople(){if(ref)ref.child("people").set(P.length?P:null)}
function fbPin(n){if(ref)ref.child("pins/"+enc(n)).set(K[n]===undefined?null:K[n])}
function attach(){
  if(!room||!initFb())return;
  if(ref)ref.off();
  ref=db.ref("rooms/"+room);
  ref.on("value",s=>{
    const v=s.val();if(!v)return;
    P=v.people?Object.values(v.people):[];
    D=v.exp?Object.values(v.exp):[];
    K={};if(v.pins)for(const k in v.pins)K[decodeURIComponent(k)]=v.pins[k];
    D.forEach(x=>{if(!x.parts||!x.parts.length)x.parts=[...P]});
    save();fill();render();renderRoom();
  });
}
function mk(){
  if(!initFb()){say(t("fbNo"));return}
  const c=gen(),exp={},pins={};
  D.forEach(x=>exp[x.id]=x);for(const n in K)pins[enc(n)]=K[n];
  db.ref("rooms/"+c).set({created:Date.now(),people:P,exp,pins}).then(()=>{room=c;save();attach();renderRoom()}).catch(()=>say(t("fbErr")));
}
function jn(){
  const c=$("rin").value.toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(c.length<8){say(t("codeBad"));return}
  if(!initFb()){say(t("fbNo"));return}
  db.ref("rooms/"+c).once("value").then(s=>{
    if(!s.exists()){say(t("noRoom"));return}
    const go=()=>{room=c;save();attach();renderRoom();return true};
    if(D.length)modal(t("joinT"),'<div class="sub">'+t("joinI")+"</div>",go);else go();
  }).catch(()=>say(t("fbErr")));
}
function lv(){modal(t("leaveT"),'<div class="sub">'+t("leaveI")+"</div>",()=>{if(ref)ref.off();ref=null;room="";save();renderRoom();return true})}
function cp2(){const a=document.createElement("textarea");a.value=room;document.body.appendChild(a);a.select();try{document.execCommand("copy");say(t("copied"))}catch(e){}a.remove()}
function cp(){try{navigator.clipboard.writeText(room).then(()=>say(t("copied")),cp2)}catch(e){cp2()}}
function renderRoom(){
  const b=$("roomBox");
  if(!FB.databaseURL){b.innerHTML='<div class="sub">'+t("fbNo")+"</div>";return}
  if(room){
    b.innerHTML='<div class="sub">'+t("yourCode")+'</div><div class="rcode">'+room.slice(0,4)+" "+room.slice(4)+'</div><div class="sub" style="margin-bottom:10px">'+t("live")+'</div><div class="row"><button id="rcp">'+t("copy")+'</button><button id="rlv" class="danger" style="margin:0">'+t("leave")+"</button></div>";
    $("rcp").onclick=cp;$("rlv").onclick=lv;
  }else{
    b.innerHTML='<button class="p" id="rcr">'+t("roomNew")+'</button><div class="sub" style="margin:12px 0 6px">'+t("orJoin")+'</div><div class="row"><input id="rin" maxlength="9" autocapitalize="characters" placeholder="'+t("codeP")+'"><button class="p" id="rjn" style="flex:0 0 90px">'+t("roomJoin")+"</button></div>";
    $("rcr").onclick=mk;$("rjn").onclick=jn;
  }
}
applyLang();fill();render();renderRoom();attach();
</script>
</body>
</html>
